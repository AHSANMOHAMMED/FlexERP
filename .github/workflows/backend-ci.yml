name: Backend Addons CI

on:
  push:
    branches: [ dev, main, master ]
    paths:
      - 'flexerp_addons/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/scripts/validate_addons.py'
      - 'ruff.toml'
  pull_request:
    branches: [ dev, main, master ]
    paths:
      - 'flexerp_addons/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/scripts/validate_addons.py'
      - 'ruff.toml'
  workflow_dispatch:

env:
  FLEXERP_MODULES: flexerp_tenant_features,flexerp_vendor_rbac,flexerp_whatsapp,flexerp_invoice_branding,flexerp_payment_gateway,flexerp_mobile_api,flexerp_ops_control,flexerp_website_mobile
  FLEXERP_TEST_TAGS: /flexerp_tenant_features,/flexerp_vendor_rbac,/flexerp_whatsapp,/flexerp_invoice_branding,/flexerp_payment_gateway,/flexerp_mobile_api,/flexerp_ops_control,/flexerp_website_mobile

jobs:
  validate-addons:
    name: Validate Odoo Addons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Compile Python Files (Syntax Check)
        run: |
          python3 -m py_compile $(find flexerp_addons -name "*.py")

      - name: Validate Manifests, XML Views & Security Access
        run: |
          python3 .github/scripts/validate_addons.py

      - name: Run Ruff Lint Check
        # Uses the repository ruff.toml (Odoo runbot rules); must pass.
        run: |
          ruff check flexerp_addons

  odoo-install-tests:
    name: Install & Test FlexERP Addons (Odoo 20)
    runs-on: ubuntu-latest
    needs: validate-addons
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpq-dev libldap2-dev libsasl2-dev libxml2-dev libxslt1-dev \
            libjpeg-dev zlib1g-dev postgresql-client

      - name: Install Odoo Python requirements
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Install FlexERP modules and run their tests
        run: |
          # hr_attendance is optional for the API; installing it exercises the attendance tests.
          python odoo-bin \
            --addons-path=addons,odoo/addons,flexerp_addons \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            -d flexerp_ci \
            -i "${FLEXERP_MODULES},hr_attendance" \
            --test-enable --test-tags "${FLEXERP_TEST_TAGS}" \
            --stop-after-init --log-level=test 2>&1 | tee odoo-tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::Odoo install/tests failed (exit code $rc)"
            exit "$rc"
          fi
          # Belt and braces: any ERROR/CRITICAL log line fails the job.
          if grep -E " (ERROR|CRITICAL) " odoo-tests.log; then
            echo "::error::Errors found in Odoo log"
            exit 1
          fi

      - name: Upload Odoo log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-tests-log
          path: odoo-tests.log
