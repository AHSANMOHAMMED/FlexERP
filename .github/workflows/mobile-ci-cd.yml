name: Mobile CI/CD

on:
  push:
    branches: [ dev, main, master ]
    paths:
      - 'flexerp_mobile/**'
      - '.github/workflows/mobile-ci-cd.yml'
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ dev, main, master ]
    paths:
      - 'flexerp_mobile/**'
      - '.github/workflows/mobile-ci-cd.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: flexerp_mobile

jobs:
  analyze-and-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test --coverage

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: flexerp_mobile/coverage/
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flexerp-mobile-debug-apk
          path: flexerp_mobile/build/app/outputs/flutter-apk/app-debug.apk

  build-web:
    name: Build Web App
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --no-wasm-dry-run

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flexerp-mobile-web
          path: flexerp_mobile/build/web/

  release:
    name: Publish Release Artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: flexerp-mobile-debug-apk
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/app-debug.apk
          generate_release_notes: true
