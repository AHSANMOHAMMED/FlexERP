<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="FlexERP Mobile Suite - Multi-Tenant ERP for Sri Lanka Enterprise">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlexERP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FlexERP Mobile Suite</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #081425;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #F8FAFC;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: opacity 0.3s ease;
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #0F2238;
      border: 1.5px solid rgba(79, 70, 229, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
      margin-bottom: 20px;
    }
    .brand-icon svg {
      width: 32px;
      height: 32px;
      fill: #818CF8;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(79, 70, 229, 0.2);
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .app-title {
      font-size: 19px;
      font-weight: 700;
      color: #F8FAFC;
      letter-spacing: -0.4px;
    }
    .app-subtitle {
      font-size: 12px;
      color: #94A3B8;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div class="spinner"></div>
    <div class="app-title">FlexERP Mobile Suite</div>
    <div class="app-subtitle">Initializing Sri Lanka Enterprise Context...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
